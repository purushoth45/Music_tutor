allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    project.plugins.withId("com.android.library") {
        if (project.android.namespace == null) {
            if (project.name == "record") {
                project.android.namespace = "com.llfbandit.record"
            } else {
                def manifestFile = project.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    try {
                        def manifestXml = new XmlSlurper().parse(manifestFile)
                        def pkg = manifestXml.@package.text()
                        if (pkg) {
                            project.android.namespace = pkg
                        } else {
                            project.android.namespace = "com.example.${project.name.replace('-', '_')}"
                        }
                    } catch (Exception ignored) {
                        project.android.namespace = "com.example.${project.name.replace('-', '_')}"
                    }
                } else {
                    project.android.namespace = "com.example.${project.name.replace('-', '_')}"
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
