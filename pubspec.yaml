name: music_tutor
description: "AI-powered Music Tutor application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking & API Integration
  http: ^1.2.0

  # Navigation & State Management
  go_router: ^14.0.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Audio & MIDI
  record: ^4.4.4
  permission_handler: ^11.3.0

  # UI & Animations
  flutter_animate: ^4.2.0
  glassmorphism: ^3.0.0
  lottie: ^3.0.0
  google_fonts: 8.2.1

  # Icons & Utilities
  get_it: ^7.6.0
  intl: ^0.19.0
  provider: ^6.0.0
  lucide_icons_flutter: ^3.1.17
  path_provider: ^2.1.6
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
